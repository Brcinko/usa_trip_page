name: Deploy to VPS

# Trigger workflow on push to the main branch
on:
  push:
    branches:
      - master

# Define the deployment job
jobs:
  deploy:
    runs-on: ubuntu-latest  # Run on the latest Ubuntu runner

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Deploy files
      env:
        DEPLOY_HOST: ${{ secrets.VPS_HOSTNAME }}
        DEPLOY_PORT: ${{ secrets.VPS_SSH_PORT }}
        DEPLOY_USER: ${{ secrets.VPS_USERNAME }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        test -s ~/.ssh/known_hosts || { echo "ssh-keyscan returned no host keys"; exit 1; }
        echo "Deploying..."
        rsync -rvz --delete --chmod=D2750,F640 \
          --exclude '.git*' \
          -e "ssh -p $DEPLOY_PORT" \
          ./ "$DEPLOY_USER@$DEPLOY_HOST:./"
        echo "Deploy finished"
 
    - name: Verify site
      run: |
        curl -fsS https://usa-trip.klescinec.eu > /dev/null
        echo "Site is up"