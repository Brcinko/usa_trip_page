name: Deploy to VPS

# Trigger workflow on push to the main branch
on:
  push:
    branches:
      - master

# Define the deployment job
jobs:
  deploy:
    runs-on: ubuntu-latest  # Run on the latest Ubuntu runner

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v6

    # Step 2: Set up SSH
    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    # Step 3: Deploy files to the VPS
    - name: Deploy files
      run: |
        echo "Deploying..."
        rsync -rvz --delete --chmod=D2750,F640 \
          --exclude '.git*' \
          -e "ssh -p ${{ secrets.VPS_SSH_PORT }}" \
          ./ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOSTNAME }}:./
        echo "Deploy finished"
 
    - name: Verify site
      run: |
        curl -fsS https://usa-trip.klescinec.eu > /dev/null
        echo "Site is up"